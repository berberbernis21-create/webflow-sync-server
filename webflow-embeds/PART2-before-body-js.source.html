<!-- LF freight calc Part 2: paste Before </body> (needs Part 1 mount on page) -->
<script>
(async function(){
  "use strict";

  const API_BASE="https://webflow-sync-server.onrender.com";
  const LOOKUP_URL=API_BASE+"/api/listing";
  const PREVIEW_URL=API_BASE+"/api/freight-quote/preview";
  const SUBMIT_URL=API_BASE+"/api/freight-quote";
  const ZIP_URL=API_BASE+"/api/freight-zip";
  const MARKUP_URL=API_BASE+"/embeds/freight-part1.html";
  const ORIGIN_ADDRESS="15530 N Greenway Hayden Loop Ste 100, Scottsdale, AZ 85260";
  const JSON_HDR={"Content-Type":"application/json","Accept":"application/json"};
  const LF_MAIL='<a href="mailto:info@lostandfoundresale.com"><strong>info@lostandfoundresale.com</strong></a>';
  const LF_TEL='<a href="tel:4805887006"><strong>480-588-7006</strong></a>';
  const CRUZ_LOGO=API_BASE+"/brand/cruz-pro-line-truck.png";
  const LF_STORE=API_BASE+"/brand/showroom-exterior-v2.png";
  const shopSearchUrl=(title)=>{
    const q=encodeURIComponent(String(title||"").trim()).replace(/%20/g,"+");
    return "https://www.lostandfoundresale.com/search?query="+q;
  };
  const crewHelp=_k=>"This is your opinion only — assume straps, dollies, and normal gear. If yes, choose 1 or 2 extra people and briefly explain why.";

  const LOCAL={baseMinutes:15,basePrice:95,referenceMinutes:8,referencePrice:15,threePersonHourly:130,longHaulRoundTripMiles:100,longHaulFactor:0.8,stairFeePerExtraFlight:7,oversizeWeight:299,oversizeHeight:72,oversizeAlwaysWeight:550};
  const DRAFT_KEY="lfFreightDraft_v1";
  let step=1,maxStepReached=1,itemCounter=0,lastPreview=null,submitting=false;
  let pathMismatchAcknowledged=false;
  let pendingPathMismatch=null;
  let zipLookupTimer=null;
  let zipLookupSeq=0;
  let draftTimer=null;
  let restoringDraft=false;

  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

  // Part 1 Webflow embed is a tiny mount; pull full HTML/CSS from Render so we stay under Webflow limits.
  async function ensureMarkup(){
    if($("#lfForm"))return true;
    const host=$("#lfCalcHost")||$("#lfCalc");
    if(!host)return false;
    const res=await fetch(MARKUP_URL,{cache:"no-cache"});
    if(!res.ok)throw new Error("Failed to load calculator markup ("+res.status+")");
    host.innerHTML=await res.text();
    return Boolean($("#lfForm"));
  }

  try{
    await ensureMarkup();
  }catch(err){
    const host=$("#lfCalcHost")||$("#lfCalc");
    if(host)host.innerHTML='<p style="margin:24px auto;max-width:980px;padding:18px;font:14px/1.5 Arial,Helvetica,sans-serif;color:#9c2f2f;text-align:center">Could not load the delivery calculator. Please refresh the page.</p>';
    console.error(err);
    return;
  }

  const form=$("#lfForm"),itemsWrap=$("#lfItems"),template=$("#lfItemTemplate");
  if(!form||!itemsWrap||!template){
    console.error("LF freight: calculator markup missing (#lfForm / #lfItems / #lfItemTemplate)");
    return;
  }

  function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)}
  function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
  function bool(id){return !!$(id)?.checked}
  function value(id){return ($(id)?.value||"").trim()}
  function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
  function roundUp5(n){return Math.ceil(num(n)/5)*5}
  function compact(obj){Object.keys(obj).forEach(k=>{if(obj[k]===undefined||obj[k]===null||obj[k]==="")delete obj[k]});return obj}

  function classify(title){
    const t=String(title||"").toLowerCase();
    const nonstack=/(glass|mirror|artwork|art |wicker|cane|rattan|antique|fragile|marble|stone|sculpture)/.test(t);

    return {freightClass:null,nonStackable:nonstack};
  }

  function parseSetCount(title){
    const t=String(title||"");
    let m=t.match(/\bsets?\s+of\s+(\d{1,2})\b/i);
    if(m)return Math.min(24,parseInt(m[1],10));
    if(/\bpair\b/i.test(t))return 2;
    m=t.match(/\b(\d{1,2})\s*-?\s*(?:pc|pcs|piece|pieces)\b/i);
    if(m)return Math.min(24,parseInt(m[1],10));
    m=t.match(/\b(\d{1,2})\s+chairs?\b/i);
    if(m)return Math.min(24,parseInt(m[1],10));
    return 1;
  }

  function canNestStack(title,nonStackable){
    if(nonStackable)return false;
    const t=String(title||"").toLowerCase();
    if(/\b(recliner|sofa|loveseat|sectional|chaise|bench)\b/.test(t))return false;
    return /\b(dining\s+chairs?|side\s+chairs?|chairs?|stools?|bar\s*stools?|barstools?|ottoman)\b/.test(t);
  }

  function nestAddIn(pieceHeight,title){
    const t=String(title||"").toLowerCase();
    if(/\b(swivel|barrel)\b/.test(t))return Math.max(8,Math.min(14,Math.round(pieceHeight*0.28)||10));
    return Math.max(3,Math.min(6,Math.round(pieceHeight*0.12)||4));
  }

  function palletize(item){
    const w=num(item.width),d=num(item.depth),h=num(item.height),wt=num(item.weight);
    const qty=Math.max(1,Math.floor(num(item.quantity)||1));
    const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
    const nationwide=path==="nationwide";
    const selectedClass=item.freight_class===null||item.freight_class===""?null:num(item.freight_class);
    const setFromTitle=Math.max(1,parseSetCount(item.title));
    const pieceCount=Math.max(1,setFromTitle*qty);
    const claim=nationwide?String(item.flip_stack_claimed||"").toLowerCase():"";
    const forceFlip=nationwide&&qty>1&&claim==="yes";
    const nestable=nationwide&&canNestStack(item.title,item.non_stackable);
    let freightH=h;
    let stackNote="";
    let packingMode="single";

    // Local AZ truck jobs: qty only affects overall piece count / handling — no flip-stack packing.
    if(!nationwide){
      return {
        width:w<=48?48:roundUp5(w),
        depth:d<=40?40:roundUp5(d),
        height:Math.ceil(h+5),
        weight:Math.ceil(wt+30),
        freight_class:selectedClass,
        packaging_type:"Pallet(s)",
        non_stackable:!!item.non_stackable,
        set_count:1,
        stack_note:qty>1?("Qty "+qty+" counted toward local handling"):(item.non_stackable?"non-stackable":""),
        packing_mode:"local_single",
        packing_notes:qty>1?["Local path: quantity counts toward overall local item/handling count."]:[],
        stack_confirm_required:false,
        flip_stack_claimed:null
      };
    }

    if(pieceCount>1&&(forceFlip||nestable)){
      const add=forceFlip&&!nestable?3:nestAddIn(h,item.title);
      freightH=h+(pieceCount-1)*add;
      packingMode=forceFlip?"customer_flip_stack":"nested_stack";
      stackNote=(forceFlip?"customer flip/stack ":"stacked ")+pieceCount+" pcs (~"+Math.ceil(freightH)+"\" before pallet board) — TEAM MUST CONFIRM";
    }else if(pieceCount>1){
      freightH=h*pieceCount;
      packingMode="layered";
      stackNote="qty "+qty+" layered (~"+Math.ceil(freightH)+"\" before pallet) — TEAM MUST CONFIRM";
    }else if(item.non_stackable){
      stackNote="non-stackable";
    }

    const notes=[];
    if(qty>1){
      notes.push("TEAM MUST CONFIRM multi-piece packing before final freight rates.");
      if(forceFlip)notes.push("Customer claims flip/stack on one pallet.");
      else if(claim==="no")notes.push("Customer says these should NOT be stacked.");
      else if(claim==="unsure")notes.push("Customer is NOT SURE if these can flip/stack.");
    }

    return {
      width:w<=48?48:roundUp5(w),
      depth:d<=40?40:roundUp5(d),
      height:Math.ceil(freightH+5),
      weight:Math.ceil(wt*qty+30),
      freight_class:selectedClass,
      packaging_type:"Pallet(s)",
      non_stackable:!!item.non_stackable,
      set_count:pieceCount,
      stack_note:stackNote,
      packing_mode:packingMode,
      packing_notes:notes,
      stack_confirm_required:qty>1||pieceCount>1,
      flip_stack_claimed:qty>1?(claim||"unanswered"):null
    };
  }

  function localEstimate(minutes,itemCount,opts){
    if(!Number.isFinite(Number(minutes))||Number(minutes)<=0)return null;
    opts=opts||{};
    const m=Math.ceil(Number(minutes));
    const access=opts.access||{};
    const items=opts.items||[];
    const distanceMiles=Number(opts.distanceMiles);
    const roundTripMiles=Number.isFinite(distanceMiles)&&distanceMiles>0?distanceMiles*2:null;
    const longHaul=roundTripMiles!=null&&roundTripMiles>LOCAL.longHaulRoundTripMiles;
    const oversize=items.some(it=>{
      const w=Number(it.weight),h=Number(it.height);
      const heavyAndTall=Number.isFinite(w)&&w>=LOCAL.oversizeWeight&&Number.isFinite(h)&&h>LOCAL.oversizeHeight;
      const alwaysHeavy=Number.isFinite(w)&&w>LOCAL.oversizeAlwaysWeight;
      return heavyAndTall||alwaysHeavy;
    });
    let extraPeople=Number(access.extra_people)||0;
    if(!access.needs_more_than_two_people&&!oversize)extraPeople=0;
    if(oversize&&extraPeople<1)extraPeople=1;

    let hourly=LOCAL.basePrice;
    let trucks=1;
    if(extraPeople>=2){
      trucks=2;
      hourly=longHaul?LOCAL.basePrice*LOCAL.longHaulFactor:LOCAL.basePrice;
    }else if(extraPeople===1||oversize){
      hourly=LOCAL.threePersonHourly;
    }else if(longHaul){
      hourly=LOCAL.basePrice*LOCAL.longHaulFactor;
    }

    const scale=hourly/LOCAL.basePrice;
    const basePrice=LOCAL.basePrice*scale;
    const refPrice=LOCAL.referencePrice*scale;
    const extraMinutes=Math.max(0,m-LOCAL.baseMinutes);
    const perMinuteRate=refPrice/LOCAL.referenceMinutes;
    const rawEstimate=basePrice+(extraMinutes*perMinuteRate);
    const routeRounded=Math.ceil(rawEstimate/5)*5;
    const n=Math.max(0,Math.floor(Number(itemCount)||0));
    const multiItemAdder=n>=3?10+(n-3)*5:0;
    const flights=access.stairs?Math.max(0,Math.floor(Number(access.stair_flights)||0)):0;
    const stairFee=flights>1?(flights-1)*LOCAL.stairFeePerExtraFlight:0;

    let assemblyMinutes=0,assemblyRequired=false,assemblyConfirmOver60=false;
    const accessAssembly=String(access.assembly_required||"").toLowerCase();
    if(accessAssembly==="yes"||accessAssembly==="no"||accessAssembly==="idk"){
      if(accessAssembly==="yes"){
        assemblyRequired=true;
        if(String(access.assembly_over_15||"").toLowerCase()==="yes"){
          const mins=Math.max(0,Math.floor(Number(access.assembly_extra_minutes)||0));
          if(mins>60)assemblyConfirmOver60=true;
          assemblyMinutes+=mins;
        }
      }
    }else{
      (items||[]).forEach(it=>{
        if(String(it.assembly_required||"").toLowerCase()!=="yes")return;
        assemblyRequired=true;
        if(String(it.assembly_over_15||"").toLowerCase()!=="yes")return;
        const mins=Math.max(0,Math.floor(Number(it.assembly_extra_minutes)||0));
        if(mins>60)assemblyConfirmOver60=true;
        assemblyMinutes+=mins;
      });
    }
    const assemblyFee=assemblyMinutes>0?Math.ceil((assemblyMinutes*perMinuteRate)/5)*5:0;
    const estimated=(routeRounded+multiItemAdder)*trucks+stairFee+assemblyFee;

    return {
      drive_minutes:m,
      base_minutes:LOCAL.baseMinutes,
      base_price:basePrice,
      extra_minutes:extraMinutes,
      per_minute_rate:perMinuteRate,
      raw_estimate:rawEstimate,
      route_price:routeRounded,
      item_count:n,
      multi_item_adder:multiItemAdder,
      hourly_rate:hourly,
      truck_multiplier:trucks,
      stair_fee:stairFee,
      assembly_required:assemblyRequired,
      assembly_extra_minutes:assemblyMinutes,
      assembly_fee:assemblyFee,
      assembly_confirm_over_60:assemblyConfirmOver60,
      long_haul:longHaul,
      oversize_confirm:oversize,
      extra_people:extraPeople,
      estimated_price:estimated
    };
  }

  function rateConfirmHtml(strong,isPickup){
    const intro=isPickup
      ?'This <strong>preliminary estimate</strong> is based on the information you submitted. Contact <strong>Cruz Pro Line</strong> directly to confirm availability and <strong>final pricing</strong>, then let the shop know the confirmed pickup date by calling or emailing '+LF_MAIL+'.'
      :'This <strong>preliminary estimate</strong> is based on the information you submitted. Review your details for accuracy, then contact the delivery partner or Lost &amp; Found Resale to confirm availability and <strong>final pricing</strong>.';
    const partnerKicker=isPickup?'Confirm pricing':'Delivery partner';
    const partnerName='Cruz Pro Line';
    const partnerSub='';
    const shopKicker=isPickup?'Notify the shop of your date':'Call the shop';
    const shopExtra=isPickup?'<span class="lf-rate-shop-line">'+LF_MAIL+'</span>':'';
    return '<div class="lf-rate-confirm'+(strong?' strong':'')+'">'+
      '<h3>Next steps</h3>'+
      '<p>'+intro+'</p>'+
      '<div class="lf-rate-stack">'+
        '<div class="lf-rate-card-panel">'+
          '<div class="lf-rate-card">'+
            '<a href="tel:4803769485" aria-label="Call Cruz Pro Line"><img class="lf-rate-thumb" src="'+CRUZ_LOGO+'" alt="'+partnerName+'"></a>'+
            '<div class="lf-rate-card-text">'+
              '<span class="lf-rate-kicker">'+partnerKicker+'</span>'+
              '<strong><a class="lf-rate-name" href="tel:4803769485">'+partnerName+'</a></strong>'+
              partnerSub+
              '<a class="lf-rate-phone" href="tel:4803769485">480-376-9485</a>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="lf-rate-card-panel">'+
          '<div class="lf-rate-card">'+
            '<a href="'+(isPickup?'mailto:info@lostandfoundresale.com':'tel:4805887006')+'" aria-label="'+(isPickup?'Email Lost and Found Resale':'Call Lost and Found Resale')+'"><img class="lf-rate-thumb lf-rate-store" src="'+LF_STORE+'" alt="Lost &amp; Found Scottsdale showroom"></a>'+
            '<div class="lf-rate-card-text">'+
              '<span class="lf-rate-kicker">'+shopKicker+'</span>'+
              '<strong><a class="lf-rate-name" href="tel:4805887006">Lost &amp; Found Resale</a></strong>'+
              '<a class="lf-rate-phone" href="tel:4805887006">480-588-7006</a>'+
              shopExtra+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function setStep(next,opts){
    step=Math.max(1,Math.min(5,next));
    maxStepReached=Math.max(maxStepReached,step);
    $$(".lf-step").forEach(el=>el.hidden=Number(el.dataset.step)!==step);
    $$(".lf-progress [data-progress]").forEach(el=>{
      const n=Number(el.dataset.progress);
      const isActive=n===step;
      const isDone=n<step;
      const reachable=n<=maxStepReached;
      el.classList.toggle("active",isActive);
      el.classList.toggle("done",isDone);
      el.classList.toggle("reachable",reachable&&!isActive);
      el.setAttribute("aria-current",isActive?"step":"false");
      el.disabled=!reachable;
      el.tabIndex=reachable?0:-1;
    });
    if(step===4)syncHeavyAccessPrompts();
    if(!opts||opts.scroll!==false)$("#lfCalc").scrollIntoView({behavior:"smooth",block:"start"});
    if(step<5)scheduleSaveDraft();
  }

  function clearDraft(){
    try{sessionStorage.removeItem(DRAFT_KEY)}catch(_e){}
  }

  function startNewQuote(){
    clearDraft();
    submitting=false;
    lastPreview=null;
    maxStepReached=1;
    pathMismatchAcknowledged=false;
    pendingPathMismatch=null;
    hidePathMismatch();
    form.reset();
    const localRadio=$("#lfLocal");
    if(localRadio)localRadio.checked=true;
    if($("#lfState"))$("#lfState").value="AZ";
    if($("#lfLiftgateDelivery"))$("#lfLiftgateDelivery").checked=true;
    if($("#lfRequestMode"))$("#lfRequestMode").value="estimate";
    if($("#lfReviewAgree"))$("#lfReviewAgree").checked=false;
    ["#lfStairDetails","#lfElevatorDetails","#lfGateDetails","#lfCrewDetails"].forEach(sel=>{
      const el=$(sel);
      if(el)el.hidden=true;
    });
    $$('input[name="lf_extra_people"]').forEach(r=>{r.checked=false});
    itemsWrap.innerHTML="";
    itemCounter=0;
    addItem();
    const result=$("#lfResult");
    if(result){result.innerHTML="";result.classList.remove("show")}
    const summary=$("#lfSummary");
    if(summary)summary.innerHTML="";
    const alert=$("#lfReviewAlert");
    if(alert){alert.textContent="";alert.className="lf-alert error"}
    const btn=$("#lfReviewSubmit");
    if(btn){btn.disabled=false;btn.textContent="Submit & Email My Receipt"}
    updatePathDefaults();
    updateWhiteGloveAccess();
    syncHeavyAccessPrompts();
    setStep(1);
  }

  function scheduleSaveDraft(){
    if(restoringDraft||step>=5)return;
    clearTimeout(draftTimer);
    draftTimer=setTimeout(saveDraft,250);
  }

  function collectDraft(){
    const fieldIds=["lfName","lfEmail","lfPhone","lfType","lfStreet","lfUnit","lfCity","lfState","lfZip","lfStairs","lfFlights","lfStairNotes","lfTight","lfInside","lfUnpack","lfElevator","lfElevatorNotes","lfGate","lfGateCode","lfCrew","lfCrewWhy","lfDisassembly","lfLongCarry","lfParking","lfFragile","lfPreferredSchedule","lfNotes","lfWhiteGlove","lfWarehousePickup","lfLiftgateDelivery","lfDock","lfRequestMode","lfReviewAgree","lfAssemblyExtraMins"];
    const fields={};
    fieldIds.forEach(id=>{
      const el=$("#"+id);
      if(!el)return;
      fields[id]=el.type==="checkbox"?!!el.checked:el.value;
    });
    return {
      v:1,
      step:Math.min(step,4),
      maxStepReached:Math.min(Math.max(maxStepReached,step),4),
      pathMismatchAcknowledged:!!pathMismatchAcknowledged,
      path:$('input[name="delivery_path"]:checked')?.value||"local_az",
      fields,
      extraPeople:$('input[name="lf_extra_people"]:checked')?.value||"",
      assemblyRequired:$('input[name="lf_assembly_required"]:checked')?.value||"",
      assemblyOver15:$('input[name="lf_assembly_over15"]:checked')?.value||"",
      items:$$(".lf-item",itemsWrap).map(node=>({
        title:$(".lf-title",node)?.value||"",
        width:$(".lf-width",node)?.value||"",
        depth:$(".lf-depth",node)?.value||"",
        height:$(".lf-height",node)?.value||"",
        weight:$(".lf-weight",node)?.value||"",
        quantity:$(".lf-quantity",node)?.value||"1",
        price:$(".lf-price-input",node)?.value||"",
        product_url:$(".lf-url",node)?.value||"",
        image_url:$(".lf-image-url",node)?.value||"",
        source:$(".lf-source",node)?.value||"manual",
        freight_class:$(".lf-class",node)?.value||"",
        non_stackable:!!$(".lf-nonstack",node)?.checked,
        flip_stack_claimed:$(".lf-flip-stack:checked",node)?.value||""
      }))
    };
  }

  function saveDraft(){
    if(restoringDraft)return;
    try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(collectDraft()))}catch(_e){}
  }

  function applyDraft(draft){
    if(!draft||typeof draft!=="object")return false;
    restoringDraft=true;
    try{
      if(draft.path){
        const radio=$('input[name="delivery_path"][value="'+draft.path+'"]');
        if(radio)radio.checked=true;
      }
      const fields=draft.fields||{};
      Object.keys(fields).forEach(id=>{
        const el=$("#"+id);
        if(!el)return;
        if(el.type==="checkbox")el.checked=!!fields[id];
        else el.value=fields[id]==null?"":String(fields[id]);
      });
      if(draft.extraPeople){
        const r=$('input[name="lf_extra_people"][value="'+draft.extraPeople+'"]');
        if(r)r.checked=true;
      }
      if(draft.assemblyRequired){
        const r=$('input[name="lf_assembly_required"][value="'+draft.assemblyRequired+'"]');
        if(r)r.checked=true;
      }
      if(draft.assemblyOver15){
        const r=$('input[name="lf_assembly_over15"][value="'+draft.assemblyOver15+'"]');
        if(r)r.checked=true;
      }
      if($("#lfStairDetails"))$("#lfStairDetails").hidden=!bool("#lfStairs");
      if($("#lfElevatorDetails"))$("#lfElevatorDetails").hidden=!bool("#lfElevator");
      if($("#lfGateDetails"))$("#lfGateDetails").hidden=!bool("#lfGate");
      if($("#lfCrewDetails"))$("#lfCrewDetails").hidden=!bool("#lfCrew");
      syncAccessAssemblyAsk();
      itemsWrap.innerHTML="";
      itemCounter=0;
      const items=Array.isArray(draft.items)&&draft.items.length?draft.items:[{}];
      items.forEach(it=>addItem(it));
      pathMismatchAcknowledged=!!draft.pathMismatchAcknowledged;
      maxStepReached=Math.max(
        1,
        Math.min(4,Number(draft.maxStepReached)||Number(draft.step)||1)
      );
      const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
      updatePathBadges(path);
      updateAddressCopy(path);
      updateAccessCopy(path);
      updateWhatNext(path);
      updateHeroNotice(path);
      updatePathDefaults();
      updateWhiteGloveAccess(path);
      syncHeavyAccessPrompts();
      setStep(Math.max(1,Math.min(4,Number(draft.step)||1)),{scroll:false});
      refreshPathMismatchPanel();
      return true;
    }catch(_e){
      return false;
    }finally{
      restoringDraft=false;
    }
  }

  function itemsHaveHeavyWeight(){
    return $$(".lf-item",itemsWrap).some(node=>{
      const w=num($(".lf-weight",node)?.value);
      return Number.isFinite(w)&&w>=299;
    });
  }

  function syncHeavyAccessPrompts(){
    const heavy=itemsHaveHeavyWeight();
    [
      "#lfStairsAsk",
      "#lfFlightsLabel",
      "#lfCrewWrap",
      "#lfExtraPeopleLegend",
      "#lfCrewWhyLabel"
    ].forEach(sel=>{
      const el=$(sel);
      if(el)el.classList.toggle("lf-heavy-prompt",heavy);
    });
  }

  function fieldError(input,msg){
    input.setAttribute("aria-invalid",msg?"true":"false");
    const holder=input.closest(".lf-field");
    const error=holder?$(".lf-error",holder):null;
    if(error)error.textContent=msg||"";
  }

  function validateStep(n){
    let valid=true;
    const scope=$('.lf-step[data-step="'+n+'"]');
    if(!scope)return true;
    $$("input[required],select[required],textarea[required]",scope).forEach(input=>{
      if(input.closest(".lf-conditional")?.hidden)return;
      let msg="";
      if(input.type==="checkbox"&&!input.checked)msg="Required.";
      else if(!String(input.value||"").trim())msg="Required.";
      else if(input.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value))msg="Enter a valid email.";
      else if(input.name==="state"&&!/^[A-Za-z]{2}$/.test(input.value.trim()))msg="Use a two-letter state.";
      else if(input.name==="zip"&&!/^\d{5}(-\d{4})?$/.test(input.value.trim()))msg="Enter a valid ZIP code.";
      else if(input.type==="number"&&num(input.value)<=0)msg="Enter a number greater than zero.";
      fieldError(input,msg);
      if(msg)valid=false;
    });
    if(n===2){
      const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
      if(path==="nationwide"){
        const excluded=nationwideExclusion(value("#lfState"),value("#lfZip"));
        if(excluded){
          valid=false;
          fieldError($("#lfZip"),excluded.message);
          refreshPathMismatchPanel();
        }
      }
    }
    if(n===3&&$$(".lf-item",itemsWrap).length===0){valid=false;alert("Add at least one item.");}
    if(n===3){
      const nationwide=$('input[name="delivery_path"]:checked')?.value==="nationwide";
      $$(".lf-item",itemsWrap).forEach(node=>{
        const qty=Math.max(1,Math.floor(num($(".lf-quantity",node).value)||1));
        const err=$(".lf-flip-stack-error",node);
        if(nationwide&&qty>=2){
          const claim=$(".lf-flip-stack:checked",node)?.value||"";
          if(!(claim==="yes"||claim==="no"||claim==="unsure")){
            valid=false;
            if(err)err.textContent="Choose yes, no, or not sure for flip/stack on one pallet.";
          }else if(err){
            err.textContent="";
          }
        }else if(err){
          err.textContent="";
        }
      });
    }
    if(n===4&&bool("#lfStairs")){
      const flights=num(value("#lfFlights"));
      if(flights<1){
        valid=false;
        fieldError($("#lfFlights"),"Enter how many flights of stairs (1-20).");
      }else{
        fieldError($("#lfFlights"),"");
      }
    }
    if(n===4&&bool("#lfCrew")&&!$("#lfCrewDetails")?.hidden){
      const why=value("#lfCrewWhy");
      const extra=$('input[name="lf_extra_people"]:checked')?.value;
      const extraErr=$("#lfExtraPeopleError");
      if(!(extra==="1"||extra==="2")){
        valid=false;
        if(extraErr)extraErr.textContent="Choose 1 extra person or 2 extra people.";
      }else if(extraErr){
        extraErr.textContent="";
      }
      if(!why){
        valid=false;
        fieldError($("#lfCrewWhy"),"Please explain why you think more than two people are needed.");
      }else{
        fieldError($("#lfCrewWhy"),"");
      }
    }
    if(n===4){
      const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
      const localTruck=path==="local_az"||path==="pickup_az";
      const reqErr=$("#lfAssemblyRequiredError");
      const overErr=$("#lfAssemblyOver15Error");
      const extraErr=$("#lfAssemblyExtraError");
      const extraInput=$("#lfAssemblyExtraMins");
      if(localTruck){
        const required=$('input[name="lf_assembly_required"]:checked')?.value||"";
        if(!(required==="yes"||required==="no"||required==="idk")){
          valid=false;
          if(reqErr)reqErr.textContent="Choose Yes, No, or idk.";
        }else if(reqErr){
          reqErr.textContent="";
        }
        if(required==="yes"){
          const over=$('input[name="lf_assembly_over15"]:checked')?.value||"";
          if(!(over==="yes"||over==="no"||over==="idk")){
            valid=false;
            if(overErr)overErr.textContent="Choose Yes, No, or idk.";
          }else if(overErr){
            overErr.textContent="";
          }
          if(over==="yes"){
            const mins=Math.floor(num(extraInput?.value));
            if(!(mins>=1)||!/^\d+$/.test(String(extraInput?.value||"").trim())){
              valid=false;
              if(extraErr)extraErr.textContent="Enter minutes beyond 15 (numbers only).";
              if(extraInput)fieldError(extraInput,"Enter minutes beyond 15 (numbers only).");
            }else{
              if(extraErr)extraErr.textContent=mins>60?"Over 60 minutes will be flagged for confirmation — it increases cost.":"";
              if(extraInput)fieldError(extraInput,"");
            }
          }else{
            if(extraErr)extraErr.textContent="";
            if(extraInput){extraInput.value="";fieldError(extraInput,"");}
          }
        }else{
          if(overErr)overErr.textContent="";
          if(extraErr)extraErr.textContent="";
          if(extraInput){extraInput.value="";fieldError(extraInput,"");}
        }
      }else{
        if(reqErr)reqErr.textContent="";
        if(overErr)overErr.textContent="";
        if(extraErr)extraErr.textContent="";
        if(extraInput)fieldError(extraInput,"");
      }
    }
    return valid;
  }

  function isArizonaStateOrZip(state,zip){
    const st=String(state||"").trim().toUpperCase();
    if(st==="AZ"||st==="ARIZONA")return true;
    const z=String(zip||"").replace(/\D/g,"").slice(0,5);
    if(!/^\d{5}$/.test(z))return false;
    const n=Number(z);
    return n>=85001&&n<=86556;
  }

  function normalizeZip5(zip){
    const z=String(zip||"").replace(/\D/g,"");
    return z.length>=5?z.slice(0,5):"";
  }

  /** Nationwide quotes: contiguous US only — not Hawaii or Alaska. */
  function nationwideExclusion(state,zip){
    const st=String(state||"").trim().toUpperCase();
    const z=normalizeZip5(zip);
    const n=z?Number(z):NaN;
    if(st==="HI"||st==="HAWAII"||(Number.isFinite(n)&&n>=96701&&n<=96898)){
      return{
        required:true,
        suggested:null,
        switchLabel:"",
        message:"Nationwide freight quotes are not available for Hawaii. Please contact Lost & Found for shipping options to Hawaii."
      };
    }
    if(st==="AK"||st==="ALASKA"||(Number.isFinite(n)&&n>=99501&&n<=99950)){
      return{
        required:true,
        suggested:null,
        switchLabel:"",
        message:"Nationwide freight quotes are not available for Alaska. Please contact Lost & Found for shipping options to Alaska."
      };
    }
    return null;
  }

  function getPathAddressMismatch(){
    const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
    const state=value("#lfState").toUpperCase();
    const zip=value("#lfZip");
    if(!state&&!zip)return null;

    if(path==="nationwide"){
      const excluded=nationwideExclusion(state,zip);
      if(excluded)return excluded;
    }

    if(!state||!zip)return null;
    const inAz=isArizonaStateOrZip(state,zip);
    if((path==="local_az"||path==="pickup_az")&&!inAz){
      if(path==="pickup_az"){
        return {
          required:true,
          suggested:"nationwide",
          switchLabel:"Switch to Nationwide Freight",
          message:"This pickup address is outside Arizona. Local/consignor pickup estimates only work in Arizona — an out-of-state local estimate would be far too high and inaccurate. Switch to nationwide freight for destinations outside Arizona."
        };
      }
      return {
        required:true,
        suggested:"nationwide",
        switchLabel:"Switch to Nationwide Freight",
        message:"You selected local Arizona delivery, but this address is outside Arizona. A local truck estimate would be far too high and inaccurate here. Switch to nationwide freight?"
      };
    }
    if(path==="nationwide"&&inAz){
      return {
        required:false,
        suggested:"local_az",
        switchLabel:"Switch to Local Arizona Delivery",
        message:"You selected nationwide freight, but this looks like an Arizona address. Local delivery is usually the better fit for in-state destinations — nationwide pricing can be higher. Switch to local Arizona delivery?"
      };
    }
    return null;
  }

  function showPathMismatch(mismatch){

    const msg=$("#lfPathMismatchMsg");
    const switchBtn=$("#lfPathMismatchSwitch");
    const stayBtn=$("#lfPathMismatchStay");
    const editBtn=$("#lfPathMismatchEdit");
    if(!box||!msg||!mismatch)return;
    pendingPathMismatch=mismatch;
    msg.textContent=mismatch.message;
    if(switchBtn){
      const canSwitch=Boolean(mismatch.suggested);
      switchBtn.hidden=!canSwitch;
      switchBtn.textContent=mismatch.switchLabel||"Switch path";
    }
    if(stayBtn){
      const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
      stayBtn.hidden=!!mismatch.required;
      stayBtn.textContent=path==="nationwide"
        ?"Keep nationwide freight"
        :path==="pickup_az"
          ?"Keep consignor pickup"
          :"Keep this path";
    }
    if(editBtn)editBtn.hidden=false;
    box.hidden=false;
    box.classList.add("show");
    box.scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  async function lookupZipAndFill(opts={}){
    const zipInput=$("#lfZip");
    const cityInput=$("#lfCity");
    const stateInput=$("#lfState");
    if(!zipInput)return;
    const zip5=normalizeZip5(zipInput.value);
    if(!/^\d{5}$/.test(zip5))return;
    const seq=++zipLookupSeq;
    try{
      const res=await fetch(ZIP_URL+"?zip="+encodeURIComponent(zip5),{headers:{Accept:"application/json"}});
      const data=await res.json().catch(()=>({}));
      if(seq!==zipLookupSeq)return;
      if(!res.ok||!data?.ok){
        if(opts.showError)fieldError(zipInput,data?.error||"We could not find that ZIP code.");
        return;
      }
      fieldError(zipInput,"");
      if(cityInput)cityInput.value=data.city||"";
      if(stateInput)stateInput.value=String(data.state||"").toUpperCase();
      pathMismatchAcknowledged=false;
      refreshPathMismatchPanel();
    }catch(_err){
      if(opts.showError)fieldError(zipInput,"ZIP lookup is temporarily unavailable.");
    }
  }

  function scheduleZipLookup(){
    clearTimeout(zipLookupTimer);
    zipLookupTimer=setTimeout(()=>{
      const zip5=normalizeZip5(value("#lfZip"));
      if(zip5.length===5)lookupZipAndFill({showError:false});
    },350);
  }

  function refreshPathMismatchPanel(){

    return mismatch;
  }

  function tryAdvanceFromAddress(){

  function addItem(prefill={}){
    itemCounter++;
    const node=template.content.firstElementChild.cloneNode(true);
    node.dataset.itemId=String(itemCounter);
    $(".lf-item-number",node).textContent=String($$(".lf-item",itemsWrap).length+1);

    const title=$(".lf-title",node),w=$(".lf-width",node),d=$(".lf-depth",node),h=$(".lf-height",node),wt=$(".lf-weight",node);
    title.value=prefill.title||"";w.value=prefill.width||"";d.value=prefill.depth||"";h.value=prefill.height||"";wt.value=prefill.weight||"";
    $(".lf-quantity",node).value=prefill.quantity||1;
    $(".lf-price-input",node).value=prefill.price||"";
    $(".lf-url",node).value=prefill.product_url||"";
    $(".lf-source",node).value=prefill.source||"manual";

    const auto=classify(title.value);
    const initialClass=prefill.freight_class!==undefined&&prefill.freight_class!==null
      ? String(prefill.freight_class)
      : "";
    $(".lf-class",node).value=initialClass;
    const nationwidePrefill=$('input[name="delivery_path"]:checked')?.value==="nationwide";
    $(".lf-nonstack",node).checked=nationwidePrefill?(prefill.non_stackable??auto.nonStackable):false;
    const flipName="lf_flip_stack_"+itemCounter;
    $$(".lf-flip-stack",node).forEach(r=>{
      r.name=flipName;
      r.checked=String(prefill.flip_stack_claimed||"")===r.value;
    });

    $(".lf-remove",node).addEventListener("click",()=>{
      node.remove();renumberItems();
      if(!$$(".lf-item",itemsWrap).length)addItem();
      scheduleSaveDraft();
    });

    $(".lf-lookup",node).addEventListener("click",()=>lookupItem(node));
    const qtyInput=$(".lf-quantity",node);
    const syncStackAsk=()=>{
      const ask=$(".lf-stack-ask",node);
      const q=Math.max(1,Math.floor(num(qtyInput.value)||1));
      const nationwide=$('input[name="delivery_path"]:checked')?.value==="nationwide";
      if(ask)ask.hidden=!(nationwide&&q>=2);
      if(!nationwide||q<2){
        $$(".lf-flip-stack",node).forEach(r=>{r.checked=false});
        const err=$(".lf-flip-stack-error",node);
        if(err)err.textContent="";
      }
      updatePallet(node);
    };
    [title,w,d,h,wt,$(".lf-class",node),$(".lf-nonstack",node),qtyInput].forEach(el=>el.addEventListener("input",()=>{
      if(el===qtyInput)syncStackAsk();
      else updatePallet(node);
      if(el===wt)syncHeavyAccessPrompts();
    }));
    $$(".lf-flip-stack",node).forEach(r=>r.addEventListener("change",()=>updatePallet(node)));
    title.addEventListener("change",()=>{
      const c=classify(title.value);
      if($('input[name="delivery_path"]:checked')?.value==="nationwide"){
        $(".lf-nonstack",node).checked=c.nonStackable;
      }
      updatePallet(node);
    });

    itemsWrap.appendChild(node);
    applyItemFieldCopy(node,$('input[name="delivery_path"]:checked')?.value==="pickup_az");
    syncStackAsk();
  }

  function renumberItems(){$$(".lf-item",itemsWrap).forEach((el,i)=>$(".lf-item-number",el).textContent=String(i+1))}

  function itemFromNode(node){
    const pickup=$('input[name="delivery_path"]:checked')?.value==="pickup_az";
    const qty=Math.max(1,num($(".lf-quantity",node).value)||1);
    const nationwide=$('input[name="delivery_path"]:checked')?.value==="nationwide";
    const flip=nationwide?($(".lf-flip-stack:checked",node)?.value||""):"";
    const item={
      source:pickup?"manual":($(".lf-source",node).value||"manual"),
      title:$(".lf-title",node).value.trim(),
      width:num($(".lf-width",node).value),
      depth:num($(".lf-depth",node).value),
      height:num($(".lf-height",node).value),
      weight:num($(".lf-weight",node).value),
      quantity:qty,
      price:pickup?null:num($(".lf-price-input",node).value),
      product_url:pickup?"":$(".lf-url",node).value.trim(),
      image_url:pickup?"":($(".lf-image-url",node)?.value||"").trim(),

  function updatePallet(node){
    const i=itemFromNode(node),box=$(".lf-pallet",node);
    if(!i.width||!i.depth||!i.height||!i.weight){box.textContent="Enter dimensions and weight to see the SOP freight entry.";return}
    const classText=i.pallet.freight_class===null?"Class to be confirmed":"Class "+i.pallet.freight_class;
    const stackBit=i.pallet.stack_note?" · "+i.pallet.stack_note:(i.pallet.non_stackable?" · Non-stackable":"");
    const qtyBit=i.quantity>1?" · Qty "+i.quantity:"";
    box.innerHTML="<strong>Freight-ready entry:</strong> "+i.pallet.width+'" W × '+i.pallet.depth+'" D × '+i.pallet.height+'" H · '+i.pallet.weight+" lb · "+classText+qtyBit+stackBit;
  }

  function extractListing(raw){
    const d=raw?.listing||raw?.product||raw?.data||raw||{};
    const dims=d.dimensions||d.dimension||d.size||"";
    let width=d.width||d.item_width||d.width_in,depth=d.depth||d.item_depth||d.depth_in,height=d.height||d.item_height||d.height_in;
    const dimNum="(\\d*\\.\\d+|\\d+)";
    const parseThree=(text)=>{
      const m=String(text||"").replace(/[″"]/g,"").match(new RegExp(dimNum+"\\s*[x×X]\\s*"+dimNum+"\\s*[x×X]\\s*"+dimNum,"i"));
      return m?{width:m[1],depth:m[2],height:m[3]}:null;
    };
    if((!width||!depth||!height)&&dims){
      const p=parseThree(dims);
      if(p){width=width||p.width;depth=depth||p.depth;height=height||p.height}
    }
    if((!width||!depth||!height)&&(d.title||d.name)){
      const p=parseThree(d.title||d.name);
      if(p){width=width||p.width;depth=depth||p.depth;height=height||p.height}
    }
    return {
      title:d.title||d.name||d.product_name||"",
      width:num(width),depth:num(depth),height:num(height),
      weight:num(d.weight||d.estimated_weight||d.weight_lbs),
      price:num(d.price||d.product_price),
      product_url:d.url||d.link||d.product_url||d.webflow_url||raw?.productUrl||"",
      image_url:d.image_url||d.image||d.primary_image||(Array.isArray(raw?.images)&&raw.images[0])||"",
      freight_class:d.freight_class??d.freightClass??null
    };
  }

  async function lookupItem(node){
    const title=$(".lf-title",node).value.trim(),btn=$(".lf-lookup",node),msg=$(".lf-lookup-message",node);
    if(!title){fieldError($(".lf-title",node),"Enter the listing title or product URL.");return}
    btn.disabled=true;btn.innerHTML='<span class="lf-spin"></span>Looking Up';
    msg.className="lf-lookup-message";
    try{
      const res=await fetch(LOOKUP_URL+"?name="+encodeURIComponent(title),{headers:{"Accept":"application/json"}});
      const raw=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(raw.error||raw.message||"Listing not found.");
      const data=extractListing(raw);
      if(!data.width&&!data.depth&&!data.height&&!data.weight)throw new Error("The listing was found, but dimensions or weight were not returned. Please complete them manually.");
      if(data.title)$(".lf-title",node).value=data.title;
      if(data.width)$(".lf-width",node).value=data.width;
      if(data.depth)$(".lf-depth",node).value=data.depth;
      if(data.height)$(".lf-height",node).value=data.height;
      if(data.weight)$(".lf-weight",node).value=data.weight;
      if(data.price)$(".lf-price-input",node).value=data.price;
      if(data.product_url)$(".lf-url",node).value=data.product_url;
      if($(".lf-image-url",node))$(".lf-image-url",node).value=data.image_url||"";
      $(".lf-source",node).value="listing";
      const c=classify(data.title||title);
      if(data.freight_class!==undefined&&data.freight_class!==null&&data.freight_class!==""){
        $(".lf-class",node).value=String(data.freight_class);
      }
      if($('input[name="delivery_path"]:checked')?.value==="nationwide"){
        $(".lf-nonstack",node).checked=c.nonStackable;
      }else{
        $(".lf-nonstack",node).checked=false;
      }
      msg.textContent="Item found. Please review the dimensions, weight, price, and link before continuing.";
      msg.classList.add("show");
      updatePallet(node);
    }catch(err){
      msg.textContent=(err.message||"We could not find an exact match.")+" You can still enter the item manually.";
      msg.classList.add("show","bad");
      $(".lf-source",node).value="manual";
    }finally{btn.disabled=false;btn.textContent="Find Item"}
  }

  function accessFlags(a,isPickup){
    const flags=[];
    if(a.stairs){
      const stairParts=[];
      if(a.stair_flights>0)stairParts.push(a.stair_flights+" flight(s)");
      if(a.stair_notes)stairParts.push(a.stair_notes);
      flags.push(stairParts.length?"stairs: "+stairParts.join(" | "):"stairs");
    }
    if(a.needs_more_than_two_people){
      flags.push(a.extra_people>=2?"extra crew: 2 people (4 total)":a.extra_people===1?"extra crew: 1 person (3 total)":"more than two people");
      if(a.more_than_two_people_reason)flags.push("crew note: "+a.more_than_two_people_reason);
    }
    if(a.tight_turns_or_narrow_halls)flags.push("tight turns / narrow access");
    if(a.freight_elevator)flags.push("freight elevator");
    if(a.gated_access)flags.push("gated access");
    if(a.white_glove)flags.push("White Glove");
    if(a.room_of_choice)flags.push("Room of Choice");
    if(a.warehouse_pickup)flags.push("warehouse / terminal pickup");
    if(a.store_loading)flags.push("store loading at origin");
    if(a.liftgate_delivery)flags.push("liftgate at delivery");
    else if(a.no_liftgate)flags.push("no liftgate at delivery");
    if(a.inside_delivery)flags.push(isPickup?"inside pickup":"inside delivery");
    if(a.room_placement)flags.push(isPickup?"carry-out from room / inside":"room placement");
    if(a.unpacking_or_debris_removal)flags.push("unpacking / debris removal");
    if(a.assembly_required==="yes"||a.assembly_required==="no"||a.assembly_required==="idk"){
      if(a.assembly_required==="idk")flags.push("disassembly & reassembly: idk");
      else if(a.assembly_required==="no")flags.push("disassembly & reassembly: no");
      else if(a.assembly_over_15==="yes")flags.push("disassembly & reassembly: yes · +"+Math.max(0,Math.floor(Number(a.assembly_extra_minutes)||0))+" min beyond 15");
      else if(a.assembly_over_15==="idk")flags.push("disassembly & reassembly: yes · over 15 min: idk");
      else flags.push("disassembly & reassembly: yes (within 15 min)");
    }else if(a.disassembly_or_assembly){
      flags.push(isPickup?"disassembly may be required":"assembly or disassembly");
    }
    if(a.long_carry)flags.push("long carry");
    if(a.parking_or_time_restrictions)flags.push(isPickup?"parking or pickup-time restrictions":"parking or time restrictions");
    return flags;
  }

  function extractDriveMinutes(data){
    const options=[
      data?.drive_minutes,data?.driveMinutes,
      data?.display?.drive_minutes,data?.display?.driveMinutes,
      data?.route?.drive_minutes,data?.route?.driveMinutes,
      data?.route?.duration_minutes,data?.route?.durationMinutes,
      data?.local_estimate?.drive_minutes,data?.localEstimate?.driveMinutes,
      data?.estimate?.drive_minutes,data?.estimate?.driveMinutes
    ];
    const found=options.find(v=>Number.isFinite(Number(v))&&Number(v)>0);
    return found===undefined?null:Number(found);
  }

  function exceedsStandardPallet(item){
    const w=Number(item?.pallet?.width??item?.width);
    const d=Number(item?.pallet?.depth??item?.depth);
    if(!Number.isFinite(w)||!Number.isFinite(d)||w<=0||d<=0)return false;
    return!((w<=48&&d<=40)||(w<=40&&d<=48));
  }

    const liftgateLine=path==="nationwide"
      ? ("Liftgate delivery (your choice): "+(payload.access.liftgate_delivery?"Yes":"No")+" · Liftgate at pickup: Lost & Found will confirm")
      : "";

    $("#lfSummary").innerHTML=
      '<div class="lf-summary-card"><h3>Request</h3><p><strong>Estimate / quote request</strong> · '+pathLabel(path)+'</p></div>'+
      '<div class="lf-summary-card"><h3>'+(isPickup?"Pickup":"Delivery")+'</h3><p>'+escapeHtml(payload.delivery_address.full)+'</p><p>'+escapeHtml(payload.customer_name)+' · '+escapeHtml(payload.customer_email)+(payload.customer_phone?" · "+escapeHtml(payload.customer_phone):"")+'</p></div>'+
      '<div class="lf-summary-card"><h3>Items</h3><ul>'+itemHtml+'</ul></div>'+

    const result=$("#lfResult");
    if(pathLocal){
      const minutes=extractDriveMinutes(preview);
      const miles=Number(preview?.route?.distance_miles??preview?.display?.distance_miles);
      const qtyTotal=(payload.items||[]).reduce((sum,it)=>sum+Math.max(1,Math.floor(num(it.quantity)||1)),0);
      const est=localEstimate(minutes,qtyTotal,{
        access:payload.access,
        items:payload.items||[],
        distanceMiles:miles
      });
      const manual=flags.length>0||payload.access.fragile_or_special_handling;
      const serverPrice=Number(preview?.local_estimate?.estimated_price??preview?.display?.display_amount??preview?.display?.amount);
      const priceAmount=Number.isFinite(serverPrice)&&serverPrice>0?serverPrice:(est?est.estimated_price:null);
      const displayedAmount=priceAmount!=null?money(priceAmount):"Pending";
      const multiAdder=Number(preview?.local_estimate?.multi_item_adder??est?.multi_item_adder)||0;
      const itemCount=Number(preview?.local_estimate?.item_count??qtyTotal)||0;
      const multiNote=multiAdder>0
        ?'<p class="lf-drive-stats">Includes multi-item handling for '+itemCount+" items.</p>"
        :"";
      const assemblyFee=Number(preview?.local_estimate?.assembly_fee??est?.assembly_fee)||0;
      const assemblyMins=Number(preview?.local_estimate?.assembly_extra_minutes??est?.assembly_extra_minutes)||0;
      const assemblyRequired=Boolean(preview?.local_estimate?.assembly_required??est?.assembly_required);
      const assemblyOver60=Boolean(preview?.local_estimate?.assembly_confirm_over_60??est?.assembly_confirm_over_60);
      const assemblyTimeLabel=isPickup?"Estimated Pickup Time":"Estimated Delivery Time";
      const assemblyNote=assemblyFee>0&&assemblyMins>0
        ?'<p class="lf-drive-stats"><strong>Additional Disassembly &amp; Reassembly Time | '+assemblyMins+' Minutes</strong></p>'+
          '<p class="lf-drive-stats">'+assemblyTimeLabel+' + '+assemblyMins+' Minutes for Disassembly &amp; Reassembly'+(assemblyFee>0?' · +'+money(assemblyFee)+' (rounded up)':'')+'.</p>'
        :assemblyRequired
          ?'<p class="lf-drive-stats">Disassembly &amp; reassembly needed (within 15 minutes — no extra charge).</p>'
          :"";
      const assemblyFlag=assemblyOver60
        ?'<p class="lf-estimate-banner warn"><strong>Confirm disassembly &amp; reassembly time with the customer.</strong> Extra time over 60 minutes was entered and increases cost.</p>'
        :"";
      const stairNote="";
      const extraPeople=Number(payload.access.extra_people)||0;
      const oversize=Boolean(preview?.local_estimate?.oversize_confirm||est?.oversize_confirm);
      const longHaul=Boolean(preview?.local_estimate?.long_haul||est?.long_haul||(Number.isFinite(miles)&&miles*2>LOCAL.longHaulRoundTripMiles));
      const priceLabel=oversize
        ?"Preliminary Estimate (Size-Based 3-Person): "
        :longHaul
          ?"Best-Guess Estimate (Out of town — callout): "
          :extraPeople>=2
            ?"Two-Truck Estimate: "
            :extraPeople===1||payload.access.needs_more_than_two_people
              ?"3-Person Crew Estimate: "
              :"Your Preliminary Estimate: ";
      const oneWay=est?est.drive_minutes:(minutes?Math.ceil(minutes):null);
      const driveStats=oneWay
        ?'<p class="lf-drive-stats">Estimated drive time: about '+oneWay+" minutes each way · "+(oneWay*2)+" minutes round trip"+(Number.isFinite(miles)&&miles>0?" · "+miles+" miles each way":"")+"</p>"+
          '<p class="lf-fine lf-drive-note">Distance and time are based on the mapped route, not live traffic.</p>'
        : (Number.isFinite(miles)&&miles>0
          ?'<p class="lf-drive-stats">Estimated distance: '+miles+" miles each way from our Scottsdale showroom</p>"
          :"");
      const mapUrl=preview?.route?.map_image_url||preview?.display?.map_image_url||"";
      const dirUrl=preview?.route?.directions_url||preview?.display?.directions_url||"";
      const mapHtml=routeMapHtml(mapUrl,dirUrl);
      const laborText=isPickup
        ?"Your estimated time is round-trip and includes preparation, wrapping, loading and securing, return to the showroom, unloading, and placement."
        :"Your estimated time is round-trip and includes wrapping and preparation, loading and securing, delivery, unloading, and placement.";
      const buyHtml=buyItemsHtml(payload.items,isPickup,{
        address:payload.delivery_address?.full||"",
        preferred:payload.access?.preferred_days_windows||""
      });
      const oversizeHtml=oversize
        ?'<p class="lf-estimate-banner warn"><strong>Size-based 3-person estimate.</strong> This quote assumes three people may be needed because at least one item is 299+ lb and over 72&quot; high, or over 550 lb — even if you did not select extra crew. Final rates are often lower if the delivery team confirms two people are enough (typically closer to our $95/hour rate). <strong>Please confirm with the delivery team before scheduling. This is an estimate only.</strong></p>'
        :"";
      const longHaulHtml=longHaul
        ?'<p class="lf-estimate-banner"><strong>Out of town callout (100+ mile round trip).</strong> Longer Arizona trips (like farther cities) can still work with our local truck, but confirm pricing before scheduling. This is an estimate only.</p>'
        :"";

      const timingHtml=isPickup
        ?'<p class="lf-estimate-banner" style="border-left-color:#1f4e79;"><strong>Typical timing:</strong> Same-day pickup is possible; most pickups are next-day, and we always do our best to accommodate requested pickup windows.</p>'
        :'<p class="lf-estimate-banner" style="border-left-color:#1f4e79;"><strong>Typical timing:</strong> Same-day delivery is possible; most items are next-day after purchase, and we always do our best to accommodate requested delivery windows.</p>';

      result.innerHTML=
        '<h2>'+(isPickup?"Your Preliminary Consignor Pickup Estimate":"Your Preliminary Local Delivery Estimate")+'</h2>'+
        '<div class="lf-price">'+priceLabel+displayedAmount+'</div>'+
        assemblyNote+
        assemblyFlag+
        oversizeHtml+
        longHaulHtml+
        timingHtml+
        rateConfirmHtml(true,isPickup)+
        driveStats+
        multiNote+
        stairNote+
        mapHtml+
        '<p class="lf-result-labor">'+laborText+'</p>'+
        '<p class="lf-result-confirm"><strong>Confirm pricing before scheduling.</strong> Review your emailed PDF and make sure all item, delivery, and access details are accurate when you call.</p>'+
        buyHtml+
        (manual
              ? '<p class="lf-result-review"><strong>Additional review needed:</strong> Stairs, tight access, long carries, or special handling may change the final price.</p>'
              : '');
    }else{
      const rate=preview?.nationwide_rate||{};
      const display=preview?.display||{};
      const low=Number(rate.range_low??display.range_low);
      const high=Number(rate.range_high??display.range_high);
      const hasRange=Number.isFinite(low)&&Number.isFinite(high)&&low>0&&high>=low;
      const miles=Number(rate.distance_miles??rate.route?.distance_miles??display.distance_miles??preview?.route?.distance_miles);
      const milesLine=Number.isFinite(miles)&&miles>0
        ? '<p class="lf-drive-stats" style="margin:6px 0 8px;">About '+miles+' miles from our Scottsdale showroom</p>'
        : '<p class="lf-drive-stats" style="margin:6px 0 8px;">Distance confirmed on review.</p>';
      const mapUrl=preview?.route?.map_image_url||display?.map_image_url||rate?.route?.map_image_url||"";
      const dirUrl=preview?.route?.directions_url||display?.directions_url||rate?.route?.directions_url||"";
      const mapHtml=routeMapHtml(mapUrl,dirUrl);
      const rangeText=hasRange?money(low)+" – "+money(high):"Freight-Ready";
      const outOfAz=!isArizonaStateOrZip(payload.delivery_address?.state||payload.state,payload.delivery_address?.zip||payload.zip);
      const taxHtml=outOfAz
        ? '<p style="margin:0 0 4px;font-size:14px;line-height:1.5;color:#333;"><strong>Out-of-state purchase savings:</strong> When you purchase the item online and it is shipped outside Arizona, no Arizona sales tax is charged on the item purchase at checkout. That is approximately an 8% savings compared with an Arizona purchase.</p>'+
          '<p style="margin:0 0 12px;font-size:12px;line-height:1.45;color:#666;">This applies to the merchandise purchase. Freight and other service charges are separate.</p>'
        : "";
      const buyHtml=buyItemsHtml(payload.items,false,outOfAz?{
        buyTip:"Buy online to secure the item and receive the out-of-state no-sales-tax benefit on the merchandise purchase."
      }:null);
      const oversizeHtml=oversizedPalletNoteHtml(payload.items);
      const liftgateYes=!!payload.access.liftgate_delivery;
      const whiteGloveHtml=payload.access.white_glove
        ?'<p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#333;"><strong>White Glove selected</strong> — that raises the quote versus standard threshold / curbside freight.</p>'
        :"";
      const notesHtml=[
        whiteGloveHtml,
        '<p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#333;"><strong>Liftgate at delivery:</strong> '+(liftgateYes?"Yes":"No")+'</p>',
        '<p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#333;"><strong>Pickup loading at Lost &amp; Found:</strong> We will confirm whether a liftgate is required when requesting confirmed carrier rates.</p>',
        '<p style="margin:0 0 10px;font-size:13px;line-height:1.5;color:#333;"><strong>Pickup and loading hours:</strong> 10:00 AM–5:00 PM, Monday–Saturday.</p>',
        '<p style="margin:0;font-size:13px;line-height:1.5;color:#333;">Questions? Email '+LF_MAIL+' or call '+LF_TEL+'.</p>'
      ].filter(Boolean).join("");

      result.innerHTML=
        '<h2 style="margin:0 0 4px;">Your Preliminary Nationwide Freight Range</h2>'+
        '<div class="lf-price" style="margin:2px 0 6px;">'+rangeText+'</div>'+
        milesLine+
        '<p class="lf-estimate-banner" style="border-left-color:#1f4e79;"><strong>Typical timing:</strong> Nationwide freight is typically 3–5 business days after booking.</p>'+
        '<p style="margin:0 0 10px;font-size:15px;line-height:1.5;color:#222;font-weight:700;">Our team will review your request and follow up by email with confirmed rates and the best available carrier options for you.</p>'+
        '<p style="margin:0 0 10px;font-size:14px;line-height:1.5;color:#333;"><strong>Freight savings tip:</strong> Picking up from a nearby freight terminal or warehouse instead of choosing residential delivery can significantly reduce the final shipping cost. Available pickup options will be included with your confirmed rates.</p>'+
        taxHtml+
        buyHtml+
        mapHtml+
        oversizeHtml+
        '<div class="lf-result-notes" style="margin-top:10px;">'+notesHtml+'</div>';
    }
    result.classList.add("show");
  }

  async function refreshPreview(){
    if(!validateStep(2)||!validateStep(3)||!validateStep(4)){setStep(!validateStep(2)?2:!validateStep(3)?3:4);return}
    const payload=buildPayload();
    const result=$("#lfResult");
    result.innerHTML="<h2>Preparing Your Estimate</h2><p>Please wait while we review the information entered.</p>";
    result.classList.add("show");
    try{
      const res=await fetch(PREVIEW_URL,{method:"POST",headers:JSON_HDR,body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||data.message||"Preview could not be completed.");
      lastPreview=data;
      renderSummary(payload,data);
    }catch(err){
      lastPreview=null;
      renderSummary(payload,{});
      showAlert((err.message||"Live preview was unavailable.")+" The request can still be emailed for review.",true);
    }
  }

  function showAlert(msg,isError){
    const a=$("#lfAlert");
    if(!a)return;
    a.textContent=msg;
    a.className="lf-alert show "+(isError?"error":"success");
  }

  function showReviewAlert(msg){
    const a=$("#lfReviewAlert");
    if(!a)return;
    a.textContent=msg||"";
    a.className=msg?"lf-alert show error":"lf-alert error";
  }

  async function reviewEstimateAndEmail(){
    if(submitting)return;

    showReviewAlert("");

    if(!validateStep(2)){
      showReviewAlert("Please enter a valid email and complete delivery address.");
      setStep(2);
      return;
    }

    const pathMismatch=getPathAddressMismatch();
    if(pathMismatch?.required){
      showReviewAlert(pathMismatch.message);
      setStep(2);
      showPathMismatch(pathMismatch);
      return;
    }
    if(pathMismatch&&!pathMismatchAcknowledged){
      showReviewAlert(pathMismatch.message);
      setStep(2);
      showPathMismatch(pathMismatch);
      return;
    }

    if(!validateStep(3)){
      showReviewAlert("Please complete the item information before requesting the estimate.");
      setStep(3);
      return;
    }

    if(!validateStep(4)){
      showReviewAlert("Please complete the access and handling information.");
      return;
    }

    if(!$("#lfReviewAgree").checked){
      showReviewAlert("Please confirm that you understand this is an estimate and pricing must be confirmed before scheduling.");
      $("#lfReviewAgree").focus();
      return;
    }

    const payload=buildPayload();
    payload.company_website=form.elements.company_website.value;

    const btn=$("#lfReviewSubmit");
    const originalText=btn.textContent;

    submitting=true;
    btn.disabled=true;
    btn.innerHTML='<span class="lf-spin"></span>Preparing & Sending';

    let previewData=null;

    try{
      const previewResponse=await fetch(PREVIEW_URL,{
        method:"POST",
        headers:JSON_HDR,
        body:JSON.stringify(payload)
      });

      const previewJson=await previewResponse.json().catch(()=>({}));

      if(previewResponse.ok){
        previewData=previewJson;
        lastPreview=previewJson;
      }
    }catch(previewError){
      previewData=null;
      lastPreview=null;
    }

    payload.preview=previewData||undefined;

    try{
      const submitResponse=await fetch(SUBMIT_URL,{
        method:"POST",
        headers:JSON_HDR,
        body:JSON.stringify(payload)
      });

      const submitJson=await submitResponse.json().catch(()=>({}));

      if(!submitResponse.ok){
        throw new Error(submitJson.error||submitJson.message||"The estimate request could not be submitted.");
      }

      $("#lfReceiptEmail").textContent=payload.customer_email;
      updateConfirmationCopy(payload.delivery_path,payload.customer_email);
      const pickup=payload.delivery_path==="pickup_az";
      const buyerCopy=$("#lfSocialBuyerCopy");
      const pickupCopy=$("#lfSocialPickupCopy");
      if(buyerCopy)buyerCopy.hidden=pickup;
      if(pickupCopy)pickupCopy.hidden=!pickup;
      renderSummary(payload,Object.assign({},previewData||{},submitJson||{}));
      clearDraft();
      setStep(5);

      btn.textContent="Sent";
    }catch(err){
      showReviewAlert(err.message||"Something went wrong. Please try again or call 480-588-7006.");
      btn.disabled=false;
      btn.textContent=originalText;
      submitting=false;
    }
  }

  $$("[data-next]").forEach(btn=>btn.addEventListener("click",()=>{
    if(step===2){
      tryAdvanceFromAddress();
      return;
    }
    if(validateStep(step)){updatePathDefaults();setStep(step+1)}
  }));
  $$("[data-back]").forEach(btn=>btn.addEventListener("click",()=>setStep(step-1)));
  $$(".lf-progress [data-progress]").forEach(btn=>btn.addEventListener("click",()=>{
    const target=Number(btn.dataset.progress);
    if(!Number.isFinite(target)||target<1||target>5)return;
    if(target>maxStepReached)return;
    if(target===step)return;
    setStep(target);
  }));
  $("#lfAddItem").addEventListener("click",()=>addItem());
  $("#lfReviewSubmit").addEventListener("click",reviewEstimateAndEmail);
  ["#lfStartNewQuote","#lfStartNewQuoteTop"].forEach(sel=>{
    const btn=$(sel);
    if(btn)btn.addEventListener("click",startNewQuote);
  });
  form.addEventListener("submit",e=>e.preventDefault());
  if($("#lfPathMismatchSwitch"))$("#lfPathMismatchSwitch").addEventListener("click",()=>{
    const mismatch=pendingPathMismatch||getPathAddressMismatch();
    if(!mismatch?.suggested)return;
    pathMismatchAcknowledged=false;
    setDeliveryPath(mismatch.suggested);
    hidePathMismatch();
    updatePathDefaults();
    if(validateStep(2))setStep(3);
  });
  if($("#lfPathMismatchStay"))$("#lfPathMismatchStay").addEventListener("click",()=>{
    const mismatch=pendingPathMismatch||getPathAddressMismatch();
    if(mismatch?.required)return;
    pathMismatchAcknowledged=true;
    hidePathMismatch();
    updatePathDefaults();
    if(validateStep(2))setStep(3);
  });
  if($("#lfPathMismatchEdit"))$("#lfPathMismatchEdit").addEventListener("click",()=>{
    focusAddressForEdit();
  });
  ["#lfStreet","#lfCity","#lfState","#lfUnit"].forEach(sel=>{
    const el=$(sel);
    if(!el)return;
    const onAddressEdit=()=>{
      pathMismatchAcknowledged=false;
      refreshPathMismatchPanel();
    };
    el.addEventListener("input",onAddressEdit);
    el.addEventListener("change",onAddressEdit);
    el.addEventListener("blur",()=>{refreshPathMismatchPanel()});
  });
  const zipEl=$("#lfZip");
  if(zipEl){
    zipEl.addEventListener("input",()=>{
      const digits=String(zipEl.value||"").replace(/\D/g,"").slice(0,10);
      if(zipEl.value!==digits)zipEl.value=digits;
      pathMismatchAcknowledged=false;
      scheduleZipLookup();
      refreshPathMismatchPanel();
    });
    zipEl.addEventListener("change",()=>{
      pathMismatchAcknowledged=false;
      refreshPathMismatchPanel();
    });
    zipEl.addEventListener("blur",()=>{
      const zip5=normalizeZip5(zipEl.value);
      if(zip5.length===5)lookupZipAndFill({showError:true});
      else refreshPathMismatchPanel();
    });
  }
  $("#lfStairs").addEventListener("change",e=>{
    $("#lfStairDetails").hidden=!e.target.checked;
    if(!e.target.checked){
      if($("#lfFlights"))$("#lfFlights").value="";
      fieldError($("#lfFlights"),"");
    }
  });
  $("#lfElevator").addEventListener("change",e=>$("#lfElevatorDetails").hidden=!e.target.checked);
  $("#lfGate").addEventListener("change",e=>$("#lfGateDetails").hidden=!e.target.checked);
  if($("#lfCrew"))$("#lfCrew").addEventListener("change",e=>{
    const details=$("#lfCrewDetails");
    if(details)details.hidden=!e.target.checked;
    if(!e.target.checked){
      if($("#lfCrewWhy")){
        $("#lfCrewWhy").value="";
        fieldError($("#lfCrewWhy"),"");
      }
      $$('input[name="lf_extra_people"]').forEach(r=>{r.checked=false});
      const extraErr=$("#lfExtraPeopleError");
      if(extraErr)extraErr.textContent="";
    }
  });
  if($("#lfWhiteGlove"))$("#lfWhiteGlove").addEventListener("change",()=>updateWhiteGloveAccess());
  $$('input[name="delivery_path"]').forEach(el=>el.addEventListener("change",()=>{
    const path=$('input[name="delivery_path"]:checked').value;
    pathMismatchAcknowledged=false;
    if(path==="local_az"||path==="pickup_az"){
      const st=value("#lfState").toUpperCase();
      if(!st||st==="AZ"||isArizonaStateOrZip(st,value("#lfZip")))$("#lfState").value="AZ";
    }
    updatePathBadges(path);
    updateAddressCopy(path);
    updateAccessCopy(path);
    updateWhatNext(path);
    updateHeroNotice(path);
    syncHeavyAccessPrompts();
    refreshPathMismatchPanel();
    // Flip/stack ask is nationwide-only; assembly ask is local/pickup on access step.
    $$(".lf-item",itemsWrap).forEach(node=>{
      const ask=$(".lf-stack-ask",node);
      const q=Math.max(1,Math.floor(num($(".lf-quantity",node).value)||1));
      const nationwide=path==="nationwide";
      if(ask)ask.hidden=!(nationwide&&q>=2);
      if(!nationwide||q<2){
        $$(".lf-flip-stack",node).forEach(r=>{r.checked=false});
        const err=$(".lf-flip-stack-error",node);
        if(err)err.textContent="";
      }
      if(!nationwide){
        const ns=$(".lf-nonstack",node);
        if(ns)ns.checked=false;
      }
      updatePallet(node);
    });
    syncAccessAssemblyAsk();
  }));

  function syncAccessAssemblyAsk(){
    const path=$('input[name="delivery_path"]:checked')?.value||"local_az";
    const localTruck=path==="local_az"||path==="pickup_az";
    const block=$("#lfAssemblyAccess");
    const overWrap=$("#lfAssemblyOver15Wrap");
    const extraWrap=$("#lfAssemblyExtraWrap");
    const extraInput=$("#lfAssemblyExtraMins");
    if(block)block.hidden=!localTruck;
    if(!localTruck){
      $$('input[name="lf_assembly_required"]').forEach(r=>{r.checked=false});
      $$('input[name="lf_assembly_over15"]').forEach(r=>{r.checked=false});
      if(extraInput)extraInput.value="";
      if(overWrap)overWrap.hidden=true;
      if(extraWrap)extraWrap.hidden=true;
      const reqErr=$("#lfAssemblyRequiredError");
      const overErr=$("#lfAssemblyOver15Error");
      const extraErr=$("#lfAssemblyExtraError");
      if(reqErr)reqErr.textContent="";
      if(overErr)overErr.textContent="";
      if(extraErr)extraErr.textContent="";
      return;
    }
    const required=$('input[name="lf_assembly_required"]:checked')?.value||"";
    if(overWrap)overWrap.hidden=required!=="yes";
    if(required!=="yes"){
      $$('input[name="lf_assembly_over15"]').forEach(r=>{r.checked=false});
      if(extraInput)extraInput.value="";
    }
    const over=$('input[name="lf_assembly_over15"]:checked')?.value||"";
    if(extraWrap)extraWrap.hidden=!(required==="yes"&&over==="yes");
    if(!(required==="yes"&&over==="yes")&&extraInput)extraInput.value="";
  }

  $$('input[name="lf_assembly_required"]').forEach(r=>r.addEventListener("change",()=>{
    syncAccessAssemblyAsk();
    scheduleSaveDraft();
  }));
  $$('input[name="lf_assembly_over15"]').forEach(r=>r.addEventListener("change",()=>{
    syncAccessAssemblyAsk();
    scheduleSaveDraft();
  }));
  if($("#lfAssemblyExtraMins")){
    $("#lfAssemblyExtraMins").addEventListener("input",()=>{
      const el=$("#lfAssemblyExtraMins");
      const cleaned=String(el.value||"").replace(/[^\d]/g,"");
      if(el.value!==cleaned)el.value=cleaned;
    });
  }

  updatePathBadges();
  updateAddressCopy();
  updateAccessCopy();
  syncAccessAssemblyAsk();
  updateWhatNext();
  updateHeroNotice();
  form.addEventListener("input",scheduleSaveDraft);
  form.addEventListener("change",scheduleSaveDraft);
  let restored=false;
  try{
    const raw=sessionStorage.getItem(DRAFT_KEY);
    if(raw)restored=applyDraft(JSON.parse(raw));
  }catch(_e){restored=false}
  if(!restored)addItem();
  else scheduleSaveDraft();
})();
</script>
