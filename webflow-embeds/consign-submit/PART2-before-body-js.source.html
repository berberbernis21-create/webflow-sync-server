    function showLfModal(options) {

    function getSavedPhotoCount(excludeIndex) {
      return items.reduce(function (total, item, index) {
        if (typeof excludeIndex === "number" && index === excludeIndex) {
          return total;

        return total + ((item.photos && item.photos.length) || 0);
      }, 0);
    }
    function getTotalPhotoCountForSubmission() {
      return items.reduce(function (total, item) {

      }, 0);
    }
    function getRemainingPhotoSlotsForCurrentItem() {
      const savedPhotosExcludingCurrentEdit =
        editingIndex !== null ? getSavedPhotoCount(editingIndex) : getSavedPhotoCount();

    function setStatus(message, type) {

    function updateStepUI() {

    function scrollToActiveStep() {

    function goToStep(stepNumber, shouldScroll) {

    function getFullCustomerAddress() {
      const street = form.customerStreetAddress.value.trim();
      const city = form.customerCity.value.trim();
      const state = form.customerState.value.trim();
      const zip = form.customerZip.value.trim();
      return [street, city, state, zip].filter(Boolean).join(", ");
    }
    function validateStepOne() {
      const requiredFields = form.querySelectorAll(
        '.lf-step[data-step="1"] input[required], .lf-step[data-step="1"] select[required], .lf-step[data-step="1"] textarea[required]'
      );
      for (const field of requiredFields) {
        if (!field.checkValidity()) {
          field.reportValidity();
          return false;
        }
      }
      return true;
    }
    function isRealFile(file) {
      return !!(file && typeof file.size === "number" && file.size > 0);
    }
    function cleanFileName(name, fallback) {
      const base = name || fallback || "photo.jpg";
      return base.replace(/[^\w.\-]+/g, "_");
    }
    function replaceExtension(fileName, extension) {
      return cleanFileName(fileName || "photo", "photo")
        .replace(/\.[^.]+$/, "") + extension;
    }
    function getRawFileKey(file) {
      return [
        file && file.name ? file.name : "unnamed",
        file && file.size ? file.size : 0,
        file && file.lastModified ? file.lastModified : 0,
        file && file.type ? file.type : "unknown"
      ].join("|");
    }
    function assignOriginalKey(file, key) {
      try {
        Object.defineProperty(file, "_lfOriginalKey", {
          value: key,
          configurable: true
        });
      } catch (error) {
        try {
          file._lfOriginalKey = key;
        } catch (ignored) {}
      }
      return file;
    }
    function getFileKey(file) {
      return file && file._lfOriginalKey ? file._lfOriginalKey : getRawFileKey(file);
    }
    function getNativeInputFiles(sourceInput) {
      const inputsToRead = sourceInput ? [sourceInput] : photoInputs;
      return inputsToRead.reduce(function (allFiles, input) {
        if (!input || !input.files) return allFiles;
        return allFiles.concat(Array.from(input.files).filter(isRealFile));
      }, []);
    }
    function isBrowserReadableImage(file) {
      const type = file && file.type ? file.type.toLowerCase() : "";
      return (
        type === "image/jpeg" ||
        type === "image/jpg" ||
        type === "image/png" ||
        type === "image/webp" ||
        type === "image/gif"
      );
    }
    function isHeicFile(file) {
      const name = file && file.name ? file.name.toLowerCase() : "";
      const type = file && file.type ? file.type.toLowerCase() : "";
      if (isBrowserReadableImage(file)) {
        return false;
      }
      return (
        name.endsWith(".heic") ||
        name.endsWith(".heif") ||
        type.includes("heic") ||
        type.includes("heif")
      );
    }
    async function convertHeicToJpeg(file, originalKey) {
      if (!isHeicFile(file)) {
        return assignOriginalKey(file, originalKey);
      }
      if (typeof heic2any !== "function") {
        throw new Error("HEIC converter is not loaded.");
      }
      const newFileName = replaceExtension(file.name || "photo.heic", ".jpg");
      let firstError = null;
      try {
        const converted = await heic2any({
          blob: file,
          toType: "image/jpeg",
          quality: 0.9
        });
        const convertedBlob = Array.isArray(converted) ? converted[0] : converted;
        const jpegFile = new File(
          [convertedBlob],
          newFileName,
          {
            type: "image/jpeg",
            lastModified: Date.now()
          }
        );
        return assignOriginalKey(jpegFile, originalKey);
      } catch (error) {
        firstError = error;
        if (
          error &&
          error.message &&
          String(error.message).toLowerCase().indexOf("already browser readable") > -1
        ) {
          return assignOriginalKey(file, originalKey);
        }
        console.warn("HEIC conversion attempt 1 failed:", error);
      }
      try {
        const fileBuffer = await file.arrayBuffer();
        const forcedHeicBlob = new Blob([fileBuffer], {
          type: "image/heic"
        });
        const convertedSecond = await heic2any({
          blob: forcedHeicBlob,
          toType: "image/jpeg",
          quality: 0.85
        });
        const convertedBlobSecond = Array.isArray(convertedSecond)
          ? convertedSecond[0]
          : convertedSecond;
        const jpegFileSecond = new File(
          [convertedBlobSecond],
          newFileName,
          {
            type: "image/jpeg",
            lastModified: Date.now()
          }
        );
        return assignOriginalKey(jpegFileSecond, originalKey);
      } catch (secondError) {
        if (
          secondError &&
          secondError.message &&
          String(secondError.message).toLowerCase().indexOf("already browser readable") > -1
        ) {
          return assignOriginalKey(file, originalKey);
        }
        console.error("HEIC conversion attempt 1 failed:", firstError);
        console.error("HEIC conversion attempt 2 failed:", secondError);
        throw secondError;
      }
    }
    function compressImageFile(file, originalKey) {
      return new Promise(function (resolve) {
        if (typeof Compressor !== "function") {
          resolve(assignOriginalKey(file, originalKey));
          return;
        }
        const type = file && file.type ? file.type.toLowerCase() : "";
        if (!type.startsWith("image/")) {
          resolve(assignOriginalKey(file, originalKey));
          return;
        }
        new Compressor(file, {
          quality: 0.78,
          maxWidth: 2048,
          maxHeight: 2048,
          mimeType: "image/jpeg",
          convertSize: 500000,
          success: function (result) {
            const optimizedFile = new File(
              [result],
              replaceExtension(file.name || "photo.jpg", ".jpg"),
              {
                type: result.type || "image/jpeg",
                lastModified: Date.now()
              }
            );
            resolve(assignOriginalKey(optimizedFile, originalKey));
          },
          error: function () {
            resolve(assignOriginalKey(file, originalKey));
          }
        });
      });
    }
    async function optimizePhotoFile(file) {
      const originalKey = getRawFileKey(file);
      let workingFile = assignOriginalKey(file, originalKey);
      if (isHeicFile(workingFile)) {
        try {
          showPhotoDebug("Converting HEIC photo. This may take a few seconds.");
          workingFile = await convertHeicToJpeg(workingFile, originalKey);
        } catch (error) {
          console.error("HEIC conversion failed:", error);
          showPhotoDebug(
            "This HEIC photo could not be converted. Please upload JPEG."
          );
          return null;
        }
      }
      try {
        workingFile = await compressImageFile(workingFile, originalKey);
      } catch (error) {
        console.error("Image compression failed:", error);
      }
      return assignOriginalKey(workingFile, originalKey);
    }
    async function addFilesToSelectedFiles(files) {
      let addedCount = 0;
      for (const file of files) {
        if (!isRealFile(file)) continue;
        if (getRemainingPhotoSlotsForCurrentItem() <= 0) {
          showPhotoLimitMessage();
          break;
        }
        const originalKey = getRawFileKey(file);
        const alreadyAdded = selectedPhotoFiles.some(function (existingFile) {
          return getFileKey(existingFile) === originalKey;
        });
        if (alreadyAdded) {
          continue;
        }
        const optimizedFile = await optimizePhotoFile(file);
        if (!optimizedFile) {
          continue;
        }
        const alreadyAddedOptimized = selectedPhotoFiles.some(function (existingFile) {
          return getFileKey(existingFile) === getFileKey(optimizedFile);
        });
        if (!alreadyAddedOptimized) {
          selectedPhotoFiles.push(optimizedFile);
          addedCount += 1;
        }
      }
      return addedCount;
    }
    async function syncFilesFromInput(sourceInput) {
      const nativeFiles = getNativeInputFiles(sourceInput);
      isProcessingPhotos = true;
      if (saveItemBtn) {
        saveItemBtn.disabled = true;
        saveItemBtn.textContent = "Processing Photos...";
      }
      if (nativeFiles.length) {
        setStatus(
          "Processing selected photo" + (nativeFiles.length === 1 ? "" : "s") + "...",
          "success"
        );
      }
      let addedCount = 0;
      try {
        addedCount = await addFilesToSelectedFiles(nativeFiles);
      } finally {
        isProcessingPhotos = false;
        if (saveItemBtn) {
          saveItemBtn.disabled = false;
          saveItemBtn.textContent = editingIndex !== null ? "Update Item" : "Save Item";
        }
      }
      renderPhotoPreview();
      showCurrentItemWarnings();
      updatePhotoDebug(nativeFiles.length, addedCount);
      updateIndividualItemTip();
      if (selectedPhotoFiles.length > 0) {
        setStatus(
          selectedPhotoFiles.length +
            " photo" +
            (selectedPhotoFiles.length === 1 ? "" : "s") +
            " attached to this item.",
          "success"
        );
      }
      return {
        nativeCount: nativeFiles.length,
        addedCount: addedCount,
        attachedCount: selectedPhotoFiles.length
      };
    }
    async function validateItemForm() {
      const required = [
        itemFields.itemName,
        itemFields.category,
        itemFields.brand,
        itemFields.condition
      ];
      for (const field of required) {
        if (!field || !field.checkValidity()) {
          if (field) field.reportValidity();
          if (field === itemFields.brand) {
            showLfModal({
              icon: "!",
              title: "Brand / Maker Required",
              message:
                "Please enter the brand or maker. If you are not sure, enter Unknown. This helps prioritize your item for review.",
              buttonText: "Got It"
            });
          }
          return false;
        }
      }
      if (!itemFields.brand.value.trim()) {
        showLfModal({
          icon: "!",
          title: "Brand / Maker Required",
          message:
            "Please enter the brand or maker. If you are not sure, enter Unknown. This helps prioritize your item for review.",
          buttonText: "Got It"
        });
        itemFields.brand.focus();
        return false;
      }
      await syncFilesFromInput();
      if (isProcessingPhotos) {
        showLfModal({
          icon: "!",
          title: "Photos Processing",
          message: "Please wait while the photo is processed.",
          buttonText: "Got It"
        });
        return false;
      }
      if (!selectedPhotoFiles.length) {
        showLfModal({
          icon: "!",
          title: "Photos Required",
          message:
            "Please add at least one photo before saving this item.",
          buttonText: "Got It"
        });
        return false;
      }
      return true;
    }
    function renderPhotoPreview() {
      photoPreview.innerHTML = "";
      if (!selectedPhotoFiles.length) return;
      selectedPhotoFiles.forEach(function (file, index) {
        const div = document.createElement("div");
        div.className = "lf-photo-thumb";
        div.setAttribute("data-photo-index", String(index));
        const fileName = file && file.name ? file.name : "Selected photo";
        const lowerName = fileName.toLowerCase();
        const fileType = file && file.type ? file.type.toLowerCase() : "";
        const isHeicOrHeif =
          lowerName.endsWith(".heic") ||
          lowerName.endsWith(".heif") ||
          fileType.includes("heic") ||
          fileType.includes("heif");
        function showAttachedFallback() {
          div.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:10px;text-align:center;font-size:12px;font-weight:900;line-height:1.3;word-break:break-word;">Photo Attached<br>' +
            escapeHtml(fileName) +
            "</div>";
        }
        if (file && !isHeicOrHeif) {
          try {
            const objectUrl = URL.createObjectURL(file);
            const img = document.createElement("img");
            img.alt = "Uploaded item photo preview";
            img.src = objectUrl;
            img.onload = function () {
              setTimeout(function () {
                URL.revokeObjectURL(objectUrl);
              }, 1000);
            };
            img.onerror = function () {
              URL.revokeObjectURL(objectUrl);
              showAttachedFallback();
            };
            div.innerHTML = "";
            div.appendChild(img);
          } catch (error) {
            showAttachedFallback();
          }
        } else {
          showAttachedFallback();
        }
        photoPreview.appendChild(div);
      });
      const count = document.createElement("p");
      count.className = "lf-photo-count";
      count.textContent =
        selectedPhotoFiles.length +
        " photo" +
        (selectedPhotoFiles.length === 1 ? "" : "s") +
        " attached to this item";
      photoPreview.appendChild(count);
    }
    function getCurrentItemWarnings() {
      const warnings = [];
      if (selectedPhotoFiles.length > 0 && selectedPhotoFiles.length < 3) {
        warnings.push("Fewer than 3 photos uploaded. More photos may help us review the item faster.");
      }
      return warnings;
    }
    function showCurrentItemWarnings() {
      const warnings = getCurrentItemWarnings();
      if (!warnings.length) {
        itemWarningEl.innerHTML = "";
        itemWarningEl.classList.remove("is-visible");
        return;
      }
      itemWarningEl.innerHTML =
        "<strong>Helpful note:</strong><br>" + warnings.map(escapeHtml).join("<br>");
      itemWarningEl.classList.add("is-visible");
    }
    async function saveItem() {
      if (editingIndex === null && items.length >= MAX_ITEMS_PER_SUBMISSION) {
        showItemLimitMessage();
        return;
      }
      const isValid = await validateItemForm();
      if (!isValid) return;
      const savedPhotosExcludingCurrentEdit =
        editingIndex !== null ? getSavedPhotoCount(editingIndex) : getSavedPhotoCount();
      if (savedPhotosExcludingCurrentEdit + selectedPhotoFiles.length > MAX_PHOTOS_PER_SUBMISSION) {
        showPhotoLimitMessage();
        return;
      }
      const photosToSave = selectedPhotoFiles.slice();
      const warnings = getCurrentItemWarnings();
      const item = {
        itemNumber: editingIndex !== null ? editingIndex + 1 : items.length + 1,
        itemName: itemFields.itemName.value.trim(),
        category: itemFields.category.value.trim(),
        brand: itemFields.brand.value.trim(),
        age: itemFields.age.value.trim(),
        condition: itemFields.condition.value.trim(),
        originalPrice: itemFields.originalPrice.value.trim(),
        width: itemFields.width.value.trim(),
        depth: itemFields.depth.value.trim(),
        height: itemFields.height.value.trim(),
        conditionNotes: itemFields.conditionNotes.value.trim(),
        notes: itemFields.notes.value.trim(),
        warnings: warnings,
        photos: photosToSave
      };
      const wasEditing = editingIndex !== null;
      if (wasEditing) {
        items[editingIndex] = item;
      } else {
        items.push(item);
      }
      editingIndex = null;
      saveItemBtn.textContent = "Save Item";
      clearItemBtn.textContent = "Clear Item Form";
      renumberItems();
      renderSavedItems();
      buildReviewSummary();
      updateFinalSubmissionCounts();
      clearItemForm();
      itemTitle.textContent = "Item " + (items.length + 1) + " Details";
      updateAfterSaveHelper();
      setTimeout(function () {
        if (wasEditing) {
          showLfModal({
            icon: "✓",
            title: "Item Updated",
            message:
              "Your item has been updated. You can add another item, or tap Continue when you are done.",
            primaryText: "Add Another Item",
            secondaryText: "I'm Done, Continue",
            onPrimary: function () {
              scrollToItemEntry();
            },
            onSecondary: function () {
              scrollToContinueButton();
            }
          });
        } else {
          showPostSaveChoiceModal();
        }
      }, 150);
    }
    function clearPhotoInputs() {
      photoInputs.forEach(function (input) {
        input.value = "";
      });
    }
    function clearItemForm() {
      Object.keys(itemFields).forEach(function (key) {
        itemFields[key].value = "";
      });
      selectedPhotoFiles = [];
      clearPhotoInputs();
      renderPhotoPreview();
      clearPhotoDebug();
      updateIndividualItemTip();
      itemWarningEl.innerHTML = "";
      itemWarningEl.classList.remove("is-visible");
      editingIndex = null;
      saveItemBtn.textContent = "Save Item";
      clearItemBtn.textContent = "Clear Item Form";
      itemTitle.textContent = "Item " + (items.length + 1) + " Details";
    }
    function editItem(index) {
      const item = items[index];
      if (!item) return;
      editingIndex = index;
      itemFields.itemName.value = item.itemName || "";
      itemFields.category.value = item.category || "";
      itemFields.brand.value = item.brand || "";
      itemFields.age.value = item.age || "";
      itemFields.condition.value = item.condition || "";
      itemFields.originalPrice.value = item.originalPrice || "";
      itemFields.width.value = item.width || "";
      itemFields.depth.value = item.depth || "";
      itemFields.height.value = item.height || "";
      itemFields.conditionNotes.value = item.conditionNotes || "";
      itemFields.notes.value = item.notes || "";
      selectedPhotoFiles = item.photos ? item.photos.slice() : [];
      clearPhotoInputs();
      renderPhotoPreview();
      showPhotoDebug(
        "<strong>Attached to item:</strong> " +
          selectedPhotoFiles.length +
          " photo" +
          (selectedPhotoFiles.length === 1 ? "" : "s")
      );
      itemTitle.textContent = "Update Item " + (index + 1) + " Details";
      saveItemBtn.textContent = "Update Item";
      clearItemBtn.textContent = "Cancel Edit";
      showCurrentItemWarnings();
      updateIndividualItemTip();
      goToStep(2, true);
    }
    function removeItem(index) {
      items.splice(index, 1);
      renumberItems();
      editingIndex = null;
      itemTitle.textContent = "Item " + (items.length + 1) + " Details";
      saveItemBtn.textContent = "Save Item";
      clearItemBtn.textContent = "Clear Item Form";
      renderSavedItems();
      buildReviewSummary();
      updateFinalSubmissionCounts();
      updateAfterSaveHelper();
    }
    function renumberItems() {
      items = items.map(function (item, itemIndex) {
        item.itemNumber = itemIndex + 1;
        return item;
      });
    }
    function renderSavedItems() {
      if (!items.length) {
        savedItemsEl.innerHTML = '<p class="lf-small-note">No items saved yet.</p>';
        return;
      }
      savedItemsEl.innerHTML = items.map(function (item, index) {
        const dimensions = getDimensionsText(item);
        const reviewNoteCount = item.warnings ? item.warnings.length : 0;
        return `
          <div class="lf-saved-item">
            <div>
              <h4>Item ${index + 1}: ${escapeHtml(item.itemName)}</h4>
              <p><strong>Category:</strong> ${escapeHtml(item.category)}</p>
              <p><strong>Brand / Maker:</strong> ${escapeHtml(item.brand || "Not provided")}</p>
              <p><strong>Condition:</strong> ${escapeHtml(item.condition)}</p>
              <p><strong>Dimensions:</strong> ${escapeHtml(dimensions)}</p>
              <p><strong>Photos:</strong> ${item.photos.length}</p>
              <p><strong>Helpful Notes:</strong> ${reviewNoteCount}</p>
            </div>
            <div style="display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;">
              <button type="button" class="lf-secondary-btn" data-edit-index="${index}">
                Edit
              </button>
              <button type="button" class="lf-remove-btn" data-remove-index="${index}">
                Remove
              </button>
            </div>
          </div>
        `;
      }).join("");
    }
    function buildReviewSummary() {
      if (!items.length) {
        reviewSummaryEl.innerHTML =
          '<div class="lf-review-warning">No items have been saved yet. Please go back and save at least one item.</div>';
        updateFinalSubmissionCounts();
        return;
      }
      reviewSummaryEl.innerHTML = items.map(function (item, index) {
        const dimensions = getDimensionsText(item);
        const warnings = item.warnings || [];
        return `
          <div class="lf-review-item">
            <h3>Item ${index + 1}: ${escapeHtml(item.itemName)}</h3>
            <p><strong>Category:</strong> ${escapeHtml(item.category)}</p>
            <p><strong>Brand / Maker:</strong> ${escapeHtml(item.brand || "Not provided")}</p>
            <p><strong>Age:</strong> ${escapeHtml(item.age || "Not provided")}</p>
            <p><strong>Condition:</strong> ${escapeHtml(item.condition)}</p>
            <p><strong>Original Retail Price:</strong> ${escapeHtml(item.originalPrice || "Not provided")}</p>
            <p><strong>Dimensions:</strong> ${escapeHtml(dimensions)}</p>
            <p><strong>Condition Notes:</strong> ${escapeHtml(item.conditionNotes || "None")}</p>
            <p><strong>Additional Notes:</strong> ${escapeHtml(item.notes || "None")}</p>
            <p><strong>Photos:</strong> ${item.photos.length}</p>
            ${
              warnings.length
                ? '<div class="lf-review-warning"><strong>Helpful review notes:</strong><br>' + warnings.map(escapeHtml).join("<br>") + "</div>"
                : '<p><strong>Status:</strong> Looks complete</p>'
            }
            <button type="button" class="lf-secondary-btn" data-edit-index="${index}" style="margin-top:12px;">
              Edit This Item
            </button>
          </div>
        `;
      }).join("");
      updateFinalSubmissionCounts();
    }
    function getDimensionsText(item) {
      if (item.width && item.depth && item.height) {
        return item.width + " W x " + item.depth + " D x " + item.height + " H";
      }
      if (item.width || item.depth || item.height) {
        return [
          item.width ? item.width + " W" : "",
          item.depth ? item.depth + " D" : "",
          item.height ? item.height + " H" : ""
        ].filter(Boolean).join(" x ");
      }
      return "Not provided";
    }
    function collectSubmissionData(formData) {
      formData.append("customerName", form.customerName.value.trim());
      formData.append("customerEmail", form.customerEmail.value.trim());
      formData.append("customerPhone", form.customerPhone.value.trim());
      formData.append("customerStreetAddress", form.customerStreetAddress.value.trim());
      formData.append("customerCity", form.customerCity.value.trim());
      formData.append("customerState", form.customerState.value.trim());
      formData.append("customerZip", form.customerZip.value.trim());
      formData.append("sameItemLocation", sameItemLocationInput.value);
      formData.append("pickupLocation", pickupLocationInput.value.trim());
      formData.append("pickupNotes", form.pickupNotes.value.trim());
      formData.append("termsAcknowledged", form.termsAcknowledged.checked ? "true" : "false");
      formData.append("source", "lostandfoundresale.com/submit-items");
      const cleanItems = items.map(function (item, index) {
        const itemNumber = index + 1;
        item.photos.forEach(function (file, photoIndex) {
          const safeName =
            file && file.name
              ? file.name
              : "item-" + itemNumber + "-photo-" + (photoIndex + 1) + ".jpg";
          formData.append("item_" + itemNumber + "_photos", file, safeName);
        });
        return {
          itemNumber: itemNumber,
          itemName: item.itemName,
          category: item.category,
          brand: item.brand,
          age: item.age,
          condition: item.condition,
          originalPrice: item.originalPrice,
          width: item.width,
          depth: item.depth,
          height: item.height,
          conditionNotes: item.conditionNotes,
          notes: item.notes,
          warnings: item.warnings,
          photoCount: item.photos.length
        };
      });
      formData.append("items", JSON.stringify(cleanItems));
      formData.append("photoCount", String(getTotalPhotoCountForSubmission()));
    }
    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    if (useAddressBtn) {
      useAddressBtn.addEventListener("click", function () {
        const fullAddress = getFullCustomerAddress();
        sameItemLocationInput.value = "Yes";
        pickupLocationInput.value = fullAddress;
        pickupLocationInput.removeAttribute("required");
        pickupLocationWrap.classList.add("lf-hidden");
        useAddressBtn.classList.add("is-selected");
        differentAddressBtn.classList.remove("is-selected");
      });
    }
    if (differentAddressBtn) {
      differentAddressBtn.addEventListener("click", function () {
        sameItemLocationInput.value = "No";
        pickupLocationInput.value = "";
        pickupLocationInput.removeAttribute("required");
        pickupLocationWrap.classList.remove("lf-hidden");
        differentAddressBtn.classList.add("is-selected");
        useAddressBtn.classList.remove("is-selected");
      });
    }
    photoInputs.forEach(function (input) {
      input.addEventListener("change", async function (event) {
        const result = await syncFilesFromInput(event.currentTarget);
        if (!result.attachedCount) {
          showLfModal({
            icon: "!",
            title: "Photo Not Attached",
            message:
              "The picker opened, but no usable photo was attached. Try another photo.",
            buttonText: "Got It"
          });
        }
      });
    });
    photoPreview.addEventListener("click", function (event) {
      const thumb = event.target.closest("[data-photo-index]");
      if (!thumb) return;
      const index = Number(thumb.getAttribute("data-photo-index"));
      if (Number.isNaN(index)) return;
      selectedPhotoFiles.splice(index, 1);
      clearPhotoInputs();
      renderPhotoPreview();
      showCurrentItemWarnings();
      updateIndividualItemTip();
      if (selectedPhotoFiles.length) {
        showPhotoDebug(
          "<strong>Attached to item:</strong> " +
            selectedPhotoFiles.length +
            " photo" +
            (selectedPhotoFiles.length === 1 ? "" : "s")
        );
        setStatus(
          selectedPhotoFiles.length +
            " photo" +
            (selectedPhotoFiles.length === 1 ? "" : "s") +
            " attached to this item.",
          "success"
        );
      } else {
        clearPhotoDebug();
        setStatus("", "");
      }
    });
    Object.keys(itemFields).forEach(function (key) {
      if (!itemFields[key]) return;
      itemFields[key].addEventListener("change", showCurrentItemWarnings);
      itemFields[key].addEventListener("input", showCurrentItemWarnings);
    });
    saveItemBtn.addEventListener("click", function () {
      saveItem();
    });
    clearItemBtn.addEventListener("click", clearItemForm);
    const floatingAddMoreBtn = document.getElementById("lf-floating-add-more");
    if (floatingAddMoreBtn) {
      floatingAddMoreBtn.addEventListener("click", function () {
        goToStep(2, true);
        setTimeout(scrollToItemEntry, 250);
      });
    }
    savedItemsEl.addEventListener("click", function (event) {
      const editButton = event.target.closest("[data-edit-index]");
      const removeButton = event.target.closest("[data-remove-index]");
      if (editButton) {
        editItem(Number(editButton.dataset.editIndex));
        return;
      }
      if (removeButton) {
        removeItem(Number(removeButton.dataset.removeIndex));
      }
    });
    reviewSummaryEl.addEventListener("click", function (event) {
      const editButton = event.target.closest("[data-edit-index]");
      if (!editButton) return;
      editItem(Number(editButton.dataset.editIndex));
    });
    prevBtn.addEventListener("click", function () {
      if (currentStep > 1) {
        goToStep(currentStep - 1, true);
      }
    });
    nextBtn.addEventListener("click", function () {
      if (currentStep === 1 && !validateStepOne()) return;
      if (currentStep === 2 && !items.length) {
        showLfModal({
          icon: "!",
          title: "Save Your Item First",
          message: "Please save at least one item before continuing.",
          buttonText: "Got It"
        });
        return;
      }
      if (currentStep === 2 || currentStep === 3) {
        buildReviewSummary();
        updateFinalSubmissionCounts();
      }
      if (currentStep < totalSteps) {
        goToStep(currentStep + 1, true);
      }
    });
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      setStatus("", "");
      if (!items.length) {
        setStatus("Please save at least one item before submitting.", "error");
        goToStep(2, true);
        showLfModal({
          icon: "!",
          title: "Save Your Item First",
          message: "Please save at least one item before submitting.",
          buttonText: "Got It"
        });
        return;
      }
      const termsCheckbox = form.querySelector('input[name="termsAcknowledged"]');
      if (!termsCheckbox || !termsCheckbox.checked) {
        setStatus("Please confirm the final acknowledgment before submitting.", "error");
        if (termsCheckbox) termsCheckbox.focus();
        return;
      }
      if (items.length > MAX_ITEMS_PER_SUBMISSION) {
        showItemLimitMessage();
        return;
      }
      if (getTotalPhotoCountForSubmission() > MAX_PHOTOS_PER_SUBMISSION) {
        showPhotoLimitMessage();
        return;
      }
      for (let i = 0; i < items.length; i++) {
        if (!items[i].brand || !String(items[i].brand).trim()) {
          setStatus("Each item needs a brand or maker before submitting.", "error");
          goToStep(2, true);
          return;
        }
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      try {
        const formData = new FormData();
        collectSubmissionData(formData);
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });
        const result = await response.json().catch(function () {
          return {};
        });
        if (!response.ok) {
          throw new Error(result.error || "Submission failed. Please try again.");
        }
        setStatus(
          "Thank you. Your items were submitted successfully. Our team will review your submission and follow up by email.",
          "success"
        );
        showSubmissionConfirmationPage();
        form.reset();
        items = [];
        editingIndex = null;
        selectedPhotoFiles = [];
        clearItemForm();
        renderSavedItems();
        buildReviewSummary();
        updateFinalSubmissionCounts();
        sameItemLocationInput.value = "";
        pickupLocationInput.value = "";
        pickupLocationInput.removeAttribute("required");
        pickupLocationWrap.classList.add("lf-hidden");
        if (useAddressBtn) useAddressBtn.classList.remove("is-selected");
        if (differentAddressBtn) differentAddressBtn.classList.remove("is-selected");
        updateAfterSaveHelper();
      } catch (error) {
        setStatus(error.message || "Something went wrong. Please try again.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Items for Review";
      }
    });
    renderSavedItems();
    updateFinalSubmissionCounts();
    updateStepUI();
  })();
</script>
